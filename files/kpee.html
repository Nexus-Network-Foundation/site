<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kpee — Kazuma Print Easy Efficient</title>
<!--
  Kpee 0.3 — Kazuma Print Easy Efficient
  Paste it, one click, it's on paper.  /  貼って、1クリックで紙になる。

  No AI. No internet. Everything runs inside this one file, so it works with Wi-Fi off.
  AIなし・ネット不要。全部このファイルの中で動くので、Wi-Fiがなくても使える。

  Open:       double-click this file (Chrome, Edge, Safari, Firefox).
  Uninstall:  delete this file.
  Customize:  open this file in a text editor and scroll to the USER ZONE at the bottom.

  File layout:  style  →  script#kpee-core  →  script#kpee-languages  →  script#kpee-languages-extra  →  script#kpee-user
-->
<style>
/* ================= Win95 chrome ================= */
:root{--win:#c0c0c0;--desk:#008080;--t1:#000080;--t2:#1084d0;--dk:#808080;--dkr:#404040;--lt:#dfdfdf}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--desk);font:12px/1.35 Tahoma,"MS Sans Serif",Verdana,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;color:#000;overflow:hidden}
[hidden]{display:none!important}
#app{position:fixed;inset:12px;display:flex;flex-direction:column;background:var(--win);padding:2px;border:1px solid;border-color:#fff var(--dkr) var(--dkr) #fff;box-shadow:inset 1px 1px var(--lt),inset -1px -1px var(--dk)}
.titlebar{display:flex;align-items:center;gap:6px;padding:2px 3px 2px 6px;background:linear-gradient(90deg,var(--t1),var(--t2));color:#fff;font-weight:bold;user-select:none;flex:0 0 auto}
.titlebar .sp,.menubar .sp{flex:1}
.titlebar .tag{font-weight:normal;opacity:.9}
.titlebar .tico svg{display:block;width:16px;height:16px}
.capz{display:flex;justify-content:space-between;align-items:center;gap:8px}
.zoom{display:inline-flex;gap:2px;align-items:center;font-weight:normal}
.zoom #zoomPct{min-width:36px;text-align:end}
.tbtn{width:16px;height:14px;padding:0;font:bold 9px/11px Tahoma,sans-serif;color:#000;background:var(--win);border:1px solid;border-color:#fff var(--dkr) var(--dkr) #fff;box-shadow:inset 1px 1px var(--lt),inset -1px -1px var(--dk);cursor:pointer}
.w95{font:inherit;color:#000;padding:3px 9px;background:var(--win);border:1px solid;border-color:#fff var(--dkr) var(--dkr) #fff;box-shadow:inset 1px 1px var(--lt),inset -1px -1px var(--dk);cursor:pointer;white-space:nowrap}
.w95:active,.w95.on{border-color:var(--dkr) #fff #fff var(--dkr);box-shadow:inset 1px 1px var(--dk)}
.w95.on{background-image:repeating-conic-gradient(#fff 0 25%,var(--win) 0 50%);background-size:2px 2px}
.w95.sm{padding:1px 6px;min-width:24px}
.w95.big{font-weight:bold;padding:3px 12px}
.w95:focus-visible,.fld:focus-visible,input[type=checkbox]:focus-visible{outline:1px dotted #000;outline-offset:-4px}
.w95 u{text-decoration:underline}
.fld{font:inherit;color:#000;padding:2px 3px;background:#fff;border:1px solid;border-color:var(--dk) #fff #fff var(--dk);box-shadow:inset 1px 1px var(--dkr),inset -1px -1px var(--lt)}
.menubar{display:flex;flex-wrap:wrap;gap:3px;padding:3px;border-bottom:1px solid var(--dk);flex:0 0 auto;align-items:center}
.menubar .vsep,.fmtbar .vsep{width:2px;align-self:stretch;margin:1px 4px;border-left:1px solid var(--dk);border-right:1px solid #fff}

/* ribbon: three numbered group boxes, like Word's ribbon in Win95 clothes */
.ribbon{display:flex;flex-wrap:wrap;gap:6px;padding:4px 6px 6px;flex:0 0 auto;align-items:stretch}
fieldset.grp{margin:0;padding:4px 8px 6px;border:1px solid var(--dk);box-shadow:1px 1px #fff,inset 1px 1px #fff;display:flex;flex-wrap:wrap;gap:5px 10px;align-items:center;min-width:0}
fieldset.grp legend{padding:0 4px;font-weight:bold}
fieldset.grp label{display:flex;align-items:center;gap:4px;white-space:nowrap}
fieldset.look{max-width:430px}
fieldset.pagegrp{max-width:380px}
.modes{display:flex;flex-wrap:wrap;gap:3px}
.modebtn{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:70px;padding:3px 6px 2px;line-height:1.2}
.modebtn .ic svg{display:block;width:22px;height:22px}
.modebtn .lb{font-size:11px}
.swatches{display:inline-flex;gap:2px;align-items:center}
.sw{width:16px;height:16px;padding:0;border:1px solid;border-color:var(--dk) #fff #fff var(--dk);cursor:pointer}
.sw.on{outline:2px solid #000;outline-offset:1px}
input[type=color]{width:26px;height:20px;padding:0 1px;border:1px solid var(--dk);background:var(--win);cursor:pointer}
#modeDesc{margin:0 6px 2px;padding:3px 8px;background:#ffffe1;border:1px solid #000;flex:0 0 auto;min-height:20px}
#modeDesc b{margin-inline-end:4px}

.main{flex:1;display:grid;grid-template-columns:minmax(260px,36%) 1fr;gap:6px;padding:4px 6px 6px;min-height:0}
.pane{display:flex;flex-direction:column;min-height:0}
.pane .cap{margin:0 0 3px;font-weight:bold}
.fmtbar{display:flex;flex-wrap:wrap;gap:2px;align-items:center;margin-bottom:3px}
.fmtbar .w95.sm{height:22px}
#src{flex:1;min-height:0;resize:none;width:100%;font:13px/1.5 Consolas,"Courier New","BIZ UDGothic",monospace;padding:6px 8px;background:#fff;border:1px solid;border-color:var(--dk) #fff #fff var(--dk);box-shadow:inset 1px 1px var(--dkr),inset -1px -1px var(--lt);outline:none;white-space:pre-wrap;color:#000;tab-size:4}
.desk{flex:1;min-height:0;overflow-x:auto;overflow-y:scroll;background:#7b7b7b;border:1px solid;border-color:var(--dk) #fff #fff var(--dk);box-shadow:inset 1px 1px var(--dkr);padding:14px}
#paperWrap{margin:0 auto}
#paper{transform-origin:top left}
.statusbar{display:flex;gap:3px;padding:3px 2px 1px;flex:0 0 auto}
.statusbar span{padding:1px 6px;border:1px solid;border-color:var(--dk) #fff #fff var(--dk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statusbar .fl{flex:1;min-width:0}
.statusbar .fx{flex:0 0 auto}
@media (max-width:760px){
  #app{inset:4px}
  .main{grid-template-columns:1fr;grid-template-rows:40% 1fr}
  .statusbar .hint{display:none}
  fieldset.look,fieldset.pagegrp{max-width:none}
}
/* dialogs */
.dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,94vw);max-height:88vh;display:flex;flex-direction:column;z-index:20;background:var(--win);padding:2px;border:1px solid;border-color:#fff var(--dkr) var(--dkr) #fff;box-shadow:inset 1px 1px var(--lt),inset -1px -1px var(--dk),4px 4px 0 rgba(0,0,0,.35)}
.dlg .body{padding:10px;overflow:auto}
.dlg .btns{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;padding:0 10px 10px}
.list{background:#fff;border:1px solid;border-color:var(--dk) #fff #fff var(--dk);box-shadow:inset 1px 1px var(--dkr);min-height:120px;max-height:50vh;overflow:auto}
.list .row{display:flex;align-items:center;gap:8px;padding:4px 6px;border-bottom:1px dotted #bbb}
.list .row .rt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .row .rd{color:#555;font-size:11px}
.list .muted{padding:14px;color:#555}
.about p{margin:.45em 0}
.about kbd{font:inherit;padding:0 4px;border:1px solid var(--dk);background:#fff}
#overlay{position:fixed;inset:0;z-index:15}
#app.drop::after{content:"";position:absolute;inset:6px;border:3px dashed #000;pointer-events:none}
#pCard{background:#fff;border:1px solid;border-color:var(--dk) #fff #fff var(--dk);box-shadow:inset 1px 1px var(--dkr);min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;cursor:pointer;font-size:22px;line-height:1.4;outline:none;user-select:none}
#pCard.back{background:#ffffe1;font-size:17px}
#pCard .pside{font-size:11px;color:#555;margin-bottom:10px;text-transform:uppercase;letter-spacing:.08em}
#pCard mark{background:#fff27a}
.pbar{display:flex;justify-content:space-between;align-items:center;margin-top:6px;color:#333}

/* ================= The printed pages ================= */
/* Kpee lays out real A4 pages itself, so page numbers and page breaks are identical in every browser. */
.paper{--accent:#000;--pw:210mm;--ph:297mm;--mt:18mm;--mx:16mm;--mb:22mm;--fb:9mm;width:var(--pw);margin:0 auto;color:#000;font-size:11pt;line-height:1.6;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.paper.m-narrow{--mt:10mm;--mx:10mm;--mb:16mm;--fb:6mm}
.paper.m-wide{--mt:25mm;--mx:25mm;--mb:28mm;--fb:12mm}
.paper.p-letter{--pw:215.9mm;--ph:279.4mm}
.paper .page{position:relative;width:var(--pw);height:var(--ph);padding:var(--mt) var(--mx) var(--mb);background:#fff;overflow:hidden;box-shadow:3px 3px 0 #000;margin:0 0 14px;overflow-wrap:anywhere;word-break:break-word}
.paper .pg-foot{position:absolute;left:var(--mx);right:var(--mx);bottom:var(--fb);display:flex;justify-content:space-between;gap:12px;font-size:8.5pt;color:#555;line-height:1.2}
.paper .pg-foot span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.paper.measure{position:absolute;left:-30000px;top:0;visibility:hidden;pointer-events:none}
.paper.measure .page{height:auto;overflow:visible;box-shadow:none;margin:0}
.paper .doc-head{position:relative;z-index:1;background:#fff;display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:2px solid var(--accent);padding-bottom:4px;margin-bottom:12px}
.paper .doc-head .t{font-size:1.45em;font-weight:bold;line-height:1.2;color:var(--accent)}
.paper .doc-head .d{font-size:.85em;white-space:nowrap}
.paper h1,.paper h2,.paper h3{margin:1.1em 0 .4em;line-height:1.25;color:var(--accent)}
.paper h1{font-size:1.4em}
.paper h2{font-size:1.2em;border-bottom:1px solid currentColor;padding-bottom:2px}
.paper h3{font-size:1.02em}
.paper .doc-main>:first-child{margin-top:0}
.paper p{margin:0 0 .6em}
.paper p.center,.paper .ln.center{text-align:center}
.paper b.k{color:var(--accent)}
.paper mark{background:#fff27a;color:inherit;padding:0 .1em}
.paper u{text-decoration-thickness:1.5px;text-underline-offset:2px}
.paper ul,.paper ol{margin:0 0 .6em;padding-inline-start:1.6em}
.paper li{margin:.15em 0}
.paper table{border-collapse:collapse;margin:.4em 0 .9em;width:100%}
.paper th,.paper td{border:1px solid #000;padding:3px 6px;vertical-align:top;text-align:start}
.paper th{background:#e8e8e8}
.paper hr{border:0;border-top:1px solid #000;margin:1em 0}
.paper code{font-family:Consolas,"Courier New",monospace;font-size:.9em;background:#f0f0f0;padding:0 3px}
.paper .blank{display:inline-block;border-bottom:1.5px solid #000;min-width:4em;height:1.15em;vertical-align:baseline;position:relative;margin:0 .15em}
.paper .blank i{position:absolute;left:0;top:-.85em;font-size:.6em;font-style:normal;color:#555}
.paper table.answers td{border:0;border-bottom:1px dotted #bbb;width:50%;padding:2px 6px}
.paper p.cont,.paper .ln.cont{margin-bottom:0}
.paper .fold-note,.paper .cards-note{font-size:.8em;color:#444;text-align:center;margin:0 0 .6em}
.paper table.fold td{border:0;border-bottom:1px dotted #888;padding:6px 8px;width:50%}
.paper table.fold td.q{border-inline-end:2px dashed #000;font-weight:bold}
.paper table.fold tr.sec td{background:#e8e8e8;font-weight:bold;padding:3px 8px;border-bottom:1px solid #000}
.paper table.cards{table-layout:fixed;margin:0}
.paper table.cards td{height:50mm;width:50%;border:1px dashed #888;text-align:center;vertical-align:middle;padding:5mm;position:relative}
.paper table.cards td.none{border:0}
.paper table.cards .cbody{max-height:38mm;overflow:hidden}
.paper table.cards .cn{position:absolute;top:2mm;inset-inline-start:3mm;font-size:8pt;color:#888;font-style:normal}
.paper table.cards .front{font-size:1.5em;font-weight:bold;color:var(--accent);line-height:1.25}
.paper .ln{white-space:pre-wrap;min-height:1.6em}
.paper .summary{border:1px solid #000;padding:6px 8px;margin-top:10px;min-height:32mm}
.paper .muted{color:#666;font-size:.9em}
.paper.notes .doc-main{padding-inline-end:45mm}
.paper.notes .page .side{position:absolute;top:var(--mt);inset-inline-end:var(--mx);bottom:var(--mb);width:40mm;border-inline-start:1px solid #000;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(1.6em - 1px),#c8c8c8 calc(1.6em - 1px),#c8c8c8 1.6em)}
/* the empty page */
.paper .welcome{text-align:center;padding-top:14mm;color:#222;font-family:Verdana,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
.paper .welcome .wbig{font-size:1.6em;font-weight:bold;margin:4mm 0 8mm}
.paper .welcome ol{display:inline-block;text-align:start;font-size:1.05em;margin:0 0 8mm}
.paper .welcome h3{color:#000;margin:0 0 2mm}
.paper .welcome table{width:auto;margin:0 auto 8mm;font-size:.92em}
.paper .welcome td{border:1px solid #bbb;padding:3px 10px}
.paper .welcome td:first-child{font-family:Consolas,"Courier New",monospace;background:#f6f6f6}
/* styles */
.style-study{font-family:Verdana,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
.style-whitepaper{font-family:Georgia,"Times New Roman","Hiragino Mincho ProN","Yu Mincho",serif;line-height:1.45;text-align:justify;counter-reset:sec}
.style-whitepaper h2{counter-increment:sec;border:0;padding:0}
.style-whitepaper h2::before{content:counter(sec) ". "}
.style-whitepaper .doc-head{border-bottom-width:1px}
.style-essay{font-family:"Times New Roman",Times,"Hiragino Mincho ProN","Yu Mincho",serif;line-height:2}
.style-essay p{text-indent:2em;margin:0}
.style-essay p.center{text-indent:0}
.style-essay ul,.style-essay ol{margin-bottom:.2em}
.style-essay .doc-head{border:0;flex-direction:column;align-items:center;text-align:center;margin-bottom:1.5em}
.style-essay h2{border:0;text-align:center}
.font-sans{font-family:Verdana,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif!important}
.font-serif{font-family:Georgia,"Times New Roman","Hiragino Mincho ProN","Yu Mincho",serif!important}
.font-mono{font-family:Consolas,"Courier New","BIZ UDGothic",monospace!important}

/* ================= Print ================= */
#printroot{display:none}
@media print{
  html,body{background:#fff;height:auto;overflow:visible;margin:0}
  #app,.dlg,#overlay{display:none!important}
  #printroot{display:block}
  #printroot .paper{transform:none!important;margin:0;width:var(--pw)}
  #printroot .page{box-shadow:none;margin:0;break-after:page;page-break-after:always}
  #printroot .page:last-child{break-after:auto;page-break-after:auto}
  @page{size:A4;margin:0}
}
</style>
</head>
<body>

<div id="app">
  <div class="titlebar">
    <span class="tico"></span><span>Kpee — <span class="tag" data-i18n="tagline">Kazuma Print Easy Efficient</span></span><span class="sp"></span>
    <button class="tbtn" tabindex="-1" aria-hidden="true">_</button><button class="tbtn" tabindex="-1" aria-hidden="true">□</button><button class="tbtn" tabindex="-1" aria-hidden="true">×</button>
  </div>

  <div class="menubar">
    <button class="w95" id="bNew" data-i18n="new">New</button>
    <button class="w95" id="bDocs" data-i18n="docs">Documents</button>
    <button class="w95" id="bSave" data-i18n="save">Save</button>
    <button class="w95" id="bClear" data-i18n="clearAll">Delete all</button>
    <span class="vsep"></span>
    <button class="w95" id="bPractice" data-i18n="practice">Practice</button>
    <span class="sp"></span>
    <button class="w95" id="bPastePrint" data-i18n="pastePrint">Paste &amp; Print</button>
    <button class="w95 big" id="bPrint" data-i18n="print">Print</button>
    <select class="fld" id="lang" title="Language"></select>
    <button class="w95" id="bAbout" data-i18n="about">Help</button>
  </div>

  <div class="ribbon">
    <fieldset class="grp"><legend data-i18n="grpMode">① What kind of print?</legend><div class="modes" id="modes"></div></fieldset>
    <fieldset class="grp look"><legend data-i18n="grpLook">② Look</legend>
      <label><span data-i18n="style">Style</span> <select class="fld" id="style"></select></label>
      <label><span data-i18n="font">Font</span>
        <select class="fld" id="font">
          <option value="auto" data-i18n="auto">Auto</option>
          <option value="sans" data-i18n="sans">Sans</option>
          <option value="serif" data-i18n="serif">Serif</option>
          <option value="mono" data-i18n="mono">Mono</option>
        </select></label>
      <label><span data-i18n="size">Size</span> <input class="fld" id="size" type="number" min="8" max="18" step="0.5" value="11" style="width:52px"> pt</label>
      <label><span data-i18n="spacing">Spacing</span>
        <select class="fld" id="spacing">
          <option value="auto" data-i18n="auto">Auto</option>
          <option value="1.3">1.3</option><option value="1.5">1.5</option><option value="1.8">1.8</option><option value="2">2.0</option>
        </select></label>
      <span class="accrow" style="display:flex;align-items:center;gap:4px"><span data-i18n="accent">Colour</span> <span class="swatches" id="swatches"></span><input type="color" id="accent" value="#000000" title="Custom colour"></span>
    </fieldset>
    <fieldset class="grp pagegrp"><legend data-i18n="grpPage">③ Page</legend>
      <label><span data-i18n="paperSize">Paper</span>
        <select class="fld" id="paperSize"><option value="a4">A4</option><option value="letter">Letter</option></select></label>
      <label><span data-i18n="margins">Margins</span>
        <select class="fld" id="margin">
          <option value="narrow" data-i18n="mNarrow">Narrow</option>
          <option value="normal" data-i18n="mNormal">Normal</option>
          <option value="wide" data-i18n="mWide">Wide</option>
        </select></label>
      <label><span data-i18n="title">Title</span> <input class="fld" id="title" type="text" data-i18n-ph="titlePh" placeholder="Title (auto from first line)" style="width:170px"></label>
      <label><input type="checkbox" id="notes"> <span data-i18n="notes">Note margin</span></label>
      <label><input type="checkbox" id="pagenum" checked> <span data-i18n="pagenum">Page numbers</span></label>
      <label><input type="checkbox" id="showDate" checked> <span data-i18n="date">Date</span></label>
    </fieldset>
  </div>

  <div id="modeDesc"></div>

  <div class="main">
    <div class="pane">
      <p class="cap" data-i18n="input">1. Paste your notes here (Ctrl+V)</p>
      <div class="fmtbar" id="fmtbar">
        <button class="w95 sm" data-fmt="bold" data-i18n-title="fmtBold"><b>B</b></button>
        <button class="w95 sm" data-fmt="under" data-i18n-title="fmtUnder"><u>U</u></button>
        <button class="w95 sm" data-fmt="strike" data-i18n-title="fmtStrike"><s>S</s></button>
        <button class="w95 sm" data-fmt="hl" data-i18n-title="fmtHl"><span style="background:#fff27a;padding:0 3px">ab</span></button>
        <span class="vsep"></span>
        <button class="w95 sm" data-color="red" data-i18n-title="fmtColor"><b style="color:#d0312d">A</b></button>
        <button class="w95 sm" data-color="blue" data-i18n-title="fmtColor"><b style="color:#1f5fbf">A</b></button>
        <button class="w95 sm" data-color="green" data-i18n-title="fmtColor"><b style="color:#1e7b3c">A</b></button>
        <button class="w95 sm" data-color="orange" data-i18n-title="fmtColor"><b style="color:#e67e22">A</b></button>
        <button class="w95 sm" data-color="purple" data-i18n-title="fmtColor"><b style="color:#6b3fa0">A</b></button>
        <span class="vsep"></span>
        <button class="w95 sm" data-fmt="head" data-i18n-title="fmtHead"><b>H</b></button>
        <button class="w95 sm" data-fmt="list" data-i18n-title="fmtList">•≡</button>
        <button class="w95 sm" data-fmt="center" data-i18n-title="fmtCenter">⇔</button>
        <button class="w95 sm" data-fmt="clear" data-i18n-title="fmtClear">⌫</button>
      </div>
      <textarea id="src" spellcheck="false" dir="auto" data-i18n-ph="placeholder"></textarea>
    </div>
    <div class="pane">
      <p class="cap capz"><span data-i18n="preview">2. Check the pages → Print (Ctrl+P)</span><span class="zoom"><button class="w95 sm" data-zoom="-" title="Zoom out">−</button><button class="w95 sm" data-zoom="fit" data-i18n="fit">Fit</button><button class="w95 sm" data-zoom="+" title="Zoom in">+</button><span id="zoomPct"></span></span></p>
      <div class="desk" id="desk"><div id="paperWrap"><div class="paper style-study" id="paper" dir="auto"></div></div></div>
    </div>
  </div>

  <div class="statusbar">
    <span class="fl" id="stWords"></span>
    <span class="fl" id="stInfo"></span>
    <span class="fx" id="stStore"></span>
    <span class="fl hint" id="stHint"></span>
  </div>
</div>

<div id="overlay" hidden></div>

<div class="dlg" id="dlgDocs" hidden role="dialog">
  <div class="titlebar"><span data-i18n="docs">Documents</span><span class="sp"></span><button class="tbtn" data-close>×</button></div>
  <div class="body"><div class="list" id="docList"></div></div>

  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },

};

/* ---------------- plugin / customization API ---------------- */
Kpee.addMode = function (id, m) { if (!Kpee.modes[id]) Kpee.order.push(id); Kpee.modes[id] = Object.assign({ id, icon: Kpee.icons.clean }, m); if (state.ready) { buildModeButtons(); updateModeDesc(); } };

const COLORS = {
  red: '#d0312d', orange: '#e67e22', yellow: '#b8960b', green: '#1e7b3c', blue: '#1f5fbf', navy: '#1f3a93', purple: '#6b3fa0',
  pink: '#d63384', teal: '#007b7b', brown: '#8b5a2b', gray: '#666666', grey: '#666666', black: '#000000',
  '赤': '#d0312d', '橙': '#e67e22', '黄': '#b8960b', '緑': '#1e7b3c', '青': '#1f5fbf', '紺': '#1f3a93', '紫': '#6b3fa0', '桃': '#d63384', '灰': '#666666', '黒': '#000000'

/* ---------------- text → blocks ---------------- */
const LIST_RE = /^\s*(?:[-*•・◦▪‣]|\d{1,3}[.)]|[①-⑳]|[a-zA-Z][.)])\s+/;
const OL_RE = /^\s*(?:\d{1,3}[.)]|[①-⑳]|[a-zA-Z][.)])\s+/;
const CENTER_RE = /^->(.*)<-$/;
const END_PUNCT = /[.。!！?？,、;；]$/;
const STOP = /^(this|that|it|there|these|those|he|she|they|we|you|i|here|what|which|who|when|where|why|how|a|an|the|so|but|and|or|if|then|also|note|e\.?g\.?|i\.?e\.?|answer|example)$/i;
const DEF_RE = [
  /^([A-Za-z][A-Za-z0-9'’()\/&\- ]{0,40}?)\s+(?:is|are|was|were|means|refers to|=(?!=)|:|–|—|-)\s+(?=\S)/,
  /^([^\s、。：:＝=\-–—]{1,24}(?:\s[^\s、。：:＝=\-–—]{1,24}){0,3}?)\s*(?:とは|＝|=(?!=)|：|:|—|–)\s*(?=\S)/
];
function okTerm(t) { return (t.length >= 2 || /[\u3040-\u9fff\uac00-\ud7af]/.test(t)) && t.length <= 40 && t.split(/\s+/).length <= 4 && !STOP.test(t); }

function splitDef(text) {
  let m = /^\*\*(.+?)\*\*\s*[:：\-–—=＝]?\s*(.+)$/.exec(text); if (m) return { term: m[1], rest: m[2] };
  m = /^\[\[(.+?)\]\]\s*[:：\-–—=＝]?\s*(.+)$/.exec(text); if (m) return { term: m[1], rest: m[2] };

function matchPlugin(line, lines, i) { for (const b of Kpee.blocks) { try { if (b.match(line, lines, i)) return b; } catch (e) {} } return null; }

function parse(text) {

  const blocks = []; let i = 0;
  const blank = s => !s || !s.trim();
  while (i < lines.length) {
    const raw = lines[i], t = raw.trim();

    const pl = matchPlugin(raw, lines, i);

/* ---------------- blocks → HTML ---------------- */
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function inline(s, ctx) {

    else if (b.type === 'p') out += '<p>' + b.text.split('\n').map(fmt).join('<br>') + '</p>';
    else if (b.type === 'center') out += '<p class="center">' + fmt(b.text) + '</p>';
    else if (b.type === 'ul' || b.type === 'ol') out += '<' + b.type + '>' + b.items.map(it => '<li>' + fmt(it) + '</li>').join('') + '</' + b.type + '>';
    else if (b.type === 'hr') out += '<hr>';

}
function groupByHeading(blocks) {

}

    if (items) { for (const it of items) { const d = splitDef(it); if (d && d.rest) cards.push(d); } continue; }
    if (b.type === 'plugin' && b.plugin.id === 'table') {
      const rows = tableRows(b.lines);
      const HEAD = /^(term|terms|word|words|vocab|vocabulary|meaning|definition|answer|question|front|back|name|item|english|japanese|q|a|用語|単語|意味|説明|答え|問題|定義|語句|名前|名称|項目|内容|はたらき|働き|英語|日本語)$/i;
      const start = rows.length && rows[0].some(c => HEAD.test(c.trim())) ? 1 : 0;

Object.assign(Kpee.util, { esc, inline, parse, renderBlocks, groupByHeading, splitDef, autoKey, stripMarks, extractCards, matchPlugin, tableRows, COLORS });

/* ---------------- built-in modes ---------------- */
Kpee.addMode('clean', {

Kpee.addMode('blank', {
  icon: Kpee.icons.blank, name: t => t.modeBlank, desc: t => t.descBlank,

/* ---------------- pasted HTML (Word / Google Docs / web) → Kpee text ---------------- */
function cssHex(v) {

  if (m) { if (m[4] != null && parseFloat(m[4]) === 0) return ''; return '#' + [m[1], m[2], m[3]].map(x => (+x).toString(16).padStart(2, '0')).join(''); }
  if (/^#[0-9a-f]{3}$/.test(v)) return '#' + v.slice(1).split('').map(c => c + c).join('');
  if (/^#[0-9a-f]{6}$/.test(v)) return v;
  return COLORS[v] || '';
}
const lum = hex => { const n = parseInt(hex.slice(1), 16); return ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000; };

  const INLINE = /^(span|font|u|s|strike|del|mark|b|strong|i|em|a|ins|sub|sup)$/;

    }
    const cls = String(node.className || '');
    const hm = /^h[1-6]$/.test(tag) ? [0, tag[1]] : (/Mso(?:Title|Heading([1-6]))|\bheading\s*([1-6])\b/i.exec(cls));
    if (hm) { flush(); prefix = '#'.repeat(Math.min(3, +(hm[1] || hm[2] || 1))) + ' '; kids(node, Object.assign({}, inh, { b: true })); flush(); prefix = ''; return; }
    if (tag === 'li') {
      flush(); const p = node.parentElement;
      prefix = (p && p.tagName === 'OL') ? (Array.prototype.indexOf.call(p.children, node) + 1) + '. ' : '- ';
      kids(node, inh); flush(); prefix = ''; return;
    }
    const st = node.style || {}, raw = node.getAttribute('style') || '';

      const col = cssHex(st.color || (tag === 'font' ? node.getAttribute('color') : ''));
      if (col && lum(col) > 45 && col !== inh.col) { open += '{' + col + '|'; close = '}' + close; next.col = col; }

      if (!inh.hl && (tag === 'mark' || /mso-highlight/i.test(raw) || (bg && lum(bg) < 245))) { open += '=='; close = '==' + close; next.hl = true; }

      if (!inh.u && (tag === 'u' || tag === 'ins' || /underline/.test(deco))) { open += '++'; close = '++' + close; next.u = true; }
      if (!inh.s && (/^(s|strike|del)$/.test(tag) || /line-through/.test(deco))) { open += '~~'; close = '~~' + close; next.s = true; }
      if (!inh.b && isBold(node)) { open += '**'; close = '**' + close; next.b = true; }
    } else if (!inh.b && isBold(node)) { open += '**'; close = '**' + close; next.b = true; }

Kpee.util.htmlToText = htmlToText;

/* ---------------- pagination: lays real A4 pages out in the DOM, so every browser prints the same pages ---------------- */
function paginate(cls, fs, lh, headHtml, bodyHtml) {
  const m = $('#measure');
  m.className = cls + ' measure'; m.style.fontSize = fs; m.style.lineHeight = lh; m.style.setProperty('--accent', state.accent);
  m.innerHTML = '<div class="page">' + headHtml + '<div class="doc-body"><div class="doc-main" dir="auto">' + bodyHtml + '</div></div></div>';
  const page = m.firstElementChild;
  if (!page.offsetWidth) { m.innerHTML = ''; return null; }   // not measurable right now (e.g. mid-print): keep the last layout
  const pcs = getComputedStyle(page);
  const pwMm = parseFloat(pcs.getPropertyValue('--pw')) || 210, phMm = parseFloat(pcs.getPropertyValue('--ph')) || 297;
  const mmPx = page.offsetWidth / pwMm;
  const avail = phMm * mmPx - parseFloat(pcs.paddingTop) - parseFloat(pcs.paddingBottom) - 3 * mmPx;   // usable height, 3mm safety
  // a paragraph taller than a page is split into pieces (at line breaks, else every ~40 words) so nothing is ever cut off
  const main = page.querySelector('.doc-main');
  for (let el = main.firstElementChild; el; ) {
    const nxt = el.nextElementSibling, tag = el.tagName.toLowerCase();
    if (el.offsetHeight > avail && (tag === 'p' || (tag === 'div' && el.classList.contains('ln')))) {
      const parts = splitTall(el.innerHTML);
      if (parts.length > 1) {
        parts.forEach((ph, i) => { const c = el.cloneNode(false); c.innerHTML = ph; if (i < parts.length - 1) c.classList.add('cont'); main.insertBefore(c, el); });
        main.removeChild(el);
      }
    }
    el = nxt;
  }
  const top0 = page.getBoundingClientRect().top;
  const rect = el => { const r = el.getBoundingClientRect(); return { top: r.top - top0, bottom: r.bottom - top0 }; };
  const units = [];
  const head = page.querySelector('.doc-head');
  if (head) units.push(Object.assign({ html: head.outerHTML, kind: 'head' }, rect(head)));
  for (const el of page.querySelector('.doc-main').children) {
    const cs = getComputedStyle(el);
    const brk = el.classList.contains('kpee-break') || /page|always/.test(cs.breakBefore || '') || /always/.test(cs.pageBreakBefore || '');
    const tag = el.tagName.toLowerCase();
    let rows = null, thead = '';
    if ((tag === 'ul' || tag === 'ol') && el.children.length > 1) rows = Array.from(el.children);
    else if (tag === 'table') { const tb = el.tBodies[0]; if (tb && tb.rows.length > 1) { rows = Array.from(tb.rows); thead = el.tHead ? el.tHead.outerHTML : ''; } }
    if (rows) rows.forEach((r, idx) => units.push(Object.assign({ html: r.outerHTML, group: el, tag, thead, idx, brk: brk && idx === 0 }, rect(r))));
    else units.push(Object.assign({ html: el.outerHTML, heading: /^h[1-3]$/.test(tag), brk }, rect(el)));
  }
  const pages = []; let curP = [], top = null;
  for (const u of units) {
    if (u.brk && curP.length) { pages.push(curP); curP = []; top = null; }
    if (top === null) top = u.top;
    if (u.bottom - top > avail && curP.length) {
      let carry = [];
      if (curP.length > 1 && curP[curP.length - 1].heading) carry = [curP.pop()];   // never leave a heading alone at the bottom
      pages.push(curP); curP = carry; top = carry.length ? carry[0].top : u.top;
    }
    curP.push(u);
  }
  if (curP.length) pages.push(curP);
  m.innerHTML = '';
  return pages.map(emitPage);
}
function splitTall(html) {
  if (/<br\s*\/?>/i.test(html)) return html.split(/<br\s*\/?>/i);
  const tok = html.match(/<[^>]+>|[^<\s]+\s*|\s+/g) || [html];
  const out = []; let buf = '', words = 0;
  for (const t of tok) { buf += t; if (!t.startsWith('<') && /\S/.test(t) && ++words >= 40) { out.push(buf); buf = ''; words = 0; } }
  if (buf) out.push(buf);

}
function emitPage(units) {
  let head = '', body = '', g = null, gTag = '';
  const closeG = () => { if (g) { body += gTag === 'table' ? '</tbody></table>' : '</' + gTag + '>'; g = null; } };
  for (const u of units) {
    if (u.kind === 'head') { head = u.html; continue; }
    if (u.group) {
      if (g !== u.group) {
        closeG(); g = u.group; gTag = u.tag;
        const cls = u.group.className ? ' class="' + esc(u.group.className) + '"' : '';
        body += u.tag === 'table' ? '<table' + cls + '>' + u.thead + '<tbody>' : '<' + u.tag + cls + (u.tag === 'ol' ? ' start="' + (u.idx + 1) + '"' : '') + '>';
      }
      body += u.html;
    } else { closeG(); body += u.html; }

/* ---------------- rendering ---------------- */
function fmtDate(d) {
  try { return d.toLocaleDateString(lang === 'en' ? 'en-GB' : lang, { year: 'numeric', month: 'long', day: 'numeric' }); }
  catch (e) { return d.toDateString(); }
}
function autoTitle(text) {
  const first = text.split('\n').map(s => s.trim()).find(Boolean) || '';
  const t = stripMarks(first.replace(/^#{1,3}\s+/, ''));

}
function defaultWelcome(t) {
  const rows = [
    ['# Heading', '<b style="font-size:1.1em">Heading</b>'],
    ['- item', '• item'],
    ['**key term**', '<b>key term</b>'],
    ['==highlight==', '<mark>highlight</mark>'],
    ['{red|colour}  {blue|…}', '<span style="color:#d0312d">colour</span>'],
    ['++underline++  ~~strike~~', '<u>underline</u> <s>strike</s>'],
    ['->centre<-', 'centre'],

  return '<div class="welcome"><div class="wbig">' + t.empty + '</div>'
    + '<ol><li>' + t.step1 + '</li><li>' + t.step2 + '</li><li>' + t.step3 + '</li></ol>'
    + '<h3>' + t.cheatTitle + '</h3><table><tbody>' + rows.map(r => '<tr><td>' + esc(r[0]) + '</td><td>' + r[1] + '</td></tr>').join('') + '</tbody></table></div>';
}
function welcomeHtml() {
  if (welcomeFn) { try { return welcomeFn(cur, Kpee.util); } catch (e) { return '<p class="muted">setWelcome: ' + esc(String(e)) + '</p>'; } }

}
function renderAll() {
  const text = $('#src').value;
  let blocks = parse(text), bodyText = text;
  let title = state.title.trim();
  if (!title) {
    const fi = blocks.findIndex(b => b.type !== 'blank');
    if (fi >= 0 && blocks[fi].type === 'h' && blocks[fi].level <= 2) {
      title = blocks[fi].text; blocks = blocks.slice(fi + 1);
      const ls = text.split('\n'); ls.splice(ls.findIndex(l => l.trim()), 1); bodyText = ls.join('\n');
    }
  }
  const headTitle = title;                    // shown on the page only when it is a real title
  if (!title) title = autoTitle(text);        // used for the footer and the document list
  const date = state.showDate ? fmtDate(new Date()) : '';
  const doc = { blocks, text, bodyText, title, date };
  const mode = Kpee.modes[state.mode] || Kpee.modes.clean;
  const ctx = { t: cur, lang, options: Object.assign({}, state), util: Kpee.util };
  const cls = 'paper style-' + state.style + ' font-' + state.font + ' m-' + state.margin + ' p-' + state.paper + (state.notes ? ' notes' : '');
  injectCss('page', '@media print{@page{size:' + (state.paper === 'letter' ? 'Letter' : 'A4') + ';margin:0}}');
  const fs = state.size + 'pt', lh = state.spacing === 'auto' ? '' : String(state.spacing);
  const paper = $('#paper');
  let res = { html: '', info: '' }, n = 0;
  if (!text.trim()) {
    paper.className = cls; paper.style.fontSize = fs; paper.style.lineHeight = lh; paper.style.setProperty('--accent', state.accent);
    paper.innerHTML = '<div class="page">' + welcomeHtml() + '</div>';
  } else {
    try { res = mode.render(doc, ctx); } catch (e) { res = { html: '<p class="muted">Mode "' + esc(mode.id) + '" error: ' + esc(String(e)) + '</p>', info: '' }; }
    if (typeof res === 'string') res = { html: res, info: '' };
    const headHtml = '<header class="doc-head"><span class="t">' + inline(headTitle) + '</span><span class="d" dir="auto">' + esc(date) + '</span></header>';
    const pages = paginate(cls, fs, lh, headHtml, res.html || '');
    if (!pages) return;
    paper.className = cls; paper.style.fontSize = fs; paper.style.lineHeight = lh; paper.style.setProperty('--accent', state.accent);
    n = pages.length;
    const footTitle = esc(stripMarks(title));
    paper.innerHTML = pages.map((p, i) =>
      '<div class="page">' + p.head + '<div class="doc-body"><div class="doc-main" dir="auto">' + p.body + '</div></div>' +
      (state.notes ? '<div class="side"></div>' : '') +
      (state.pagenum ? '<div class="pg-foot"><span>' + footTitle + '</span><span>' + (i + 1) + ' / ' + n + '</span></div>' : '') +

  $('#stWords').textContent = words + ' ' + cur.words + ' / ' + chars + ' ' + cur.chars;
  $('#stInfo').textContent = (res.info ? res.info + ' · ' : '') + (n ? n + ' ' + cur.pages : '');

/* Scale the A4 preview to the desk. Runs in the next animation frame, never inside the ResizeObserver callback,
   and the desk always shows its scrollbar — together that removes the "ResizeObserver loop" error. */
let fitRaf = 0;
function scheduleFit() { if (fitRaf) cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(() => { fitRaf = 0; fit(); }); }
function fit() {
  const desk = $('#desk'), wrap = $('#paperWrap'), paper = $('#paper');
  const pw = paper.offsetWidth; if (!pw) return;
  const s = state.zoom === 'fit' ? Math.min(1, (desk.clientWidth - 30) / pw) : state.zoom / 100;
  const tf = Math.abs(s - 1) > 0.001 ? 'scale(' + s.toFixed(4) + ')' : '';
  $('#zoomPct').textContent = Math.round(s * 100) + '%';
  if (paper.style.transform !== tf) paper.style.transform = tf;
  const w = Math.round(pw * s) + 'px', h = Math.round(paper.offsetHeight * s) + 'px';
  if (wrap.style.width !== w) wrap.style.width = w;
  if (wrap.style.height !== h) wrap.style.height = h;
}

/* ---------------- documents ---------------- */
function docs() { return store.get('kpee:docs', []); }
function saveDoc() {
  const text = $('#src').value; if (!text.trim()) return;
  const list = docs();
  const title = state.title.trim() || autoTitle(text);
  const now = Date.now();
  let d = list.find(x => x.id === state.docId);
  if (!d) { d = { id: 'd' + now.toString(36) + Math.random().toString(36).slice(2, 6) }; list.unshift(d); }
  Object.assign(d, { title, text, mode: state.mode, style: state.style, updated: now });
  state.docId = d.id;

}

/* ---------------- editing helpers (the Word-like buttons) ---------------- */
function insertText(str) {
  const src = $('#src'); src.focus();
  let ok = false;
  try { ok = document.execCommand && document.execCommand('insertText', false, str); } catch (e) {}
  if (!ok) src.setRangeText(str, src.selectionStart, src.selectionEnd, 'end');

}
function wrapSel(open, close) {
  const src = $('#src'), a = src.selectionStart, b = src.selectionEnd, sel = src.value.slice(a, b);
  const lead = (sel.match(/^\s*/) || [''])[0], trail = sel.slice(lead.length).match(/\s*$/)[0];
  const core = sel.slice(lead.length, sel.length - trail.length);
  insertText(lead + open + core + close + trail);
  const s = a + lead.length + open.length; src.setSelectionRange(s, s + core.length);

function lineOp(fn) {
  const src = $('#src'), v = src.value;
  let a = src.selectionStart, b = src.selectionEnd;
  a = v.lastIndexOf('\n', a - 1) + 1;
  if (b > a && v[b - 1] === '\n') b--;
  let e = v.indexOf('\n', b); if (e < 0) e = v.length;
  src.setSelectionRange(a, e);
  const out = v.slice(a, e).split('\n').map(fn).join('\n');
  insertText(out); src.setSelectionRange(a, a + out.length);
}
const FMT = {
  bold: () => wrapSel('**', '**'), under: () => wrapSel('++', '++'), strike: () => wrapSel('~~', '~~'), hl: () => wrapSel('==', '=='),

  list: () => lineOp(l => !l.trim() ? l : /^\s*[-•*]\s/.test(l) ? l.replace(/^(\s*)[-•*]\s+/, '$1') : '- ' + l.trim()),
  center: () => lineOp(l => !l.trim() ? l : CENTER_RE.test(l.trim()) ? l.trim().slice(2, -2).trim() : '->' + l.trim() + '<-'),
  clear: () => { const src = $('#src'), a = src.selectionStart, b = src.selectionEnd; if (a === b) return; const t = src.value.slice(a, b).split('\n').map(l => stripMarks(l.replace(/^#{1,3}\s+/, ''))).join('\n'); insertText(t); src.setSelectionRange(a, a + t.length); }

/* ---------------- clipboard ---------------- */
async function readClipboard() {
  let html = '', text = '';
  if (navigator.clipboard && navigator.clipboard.read) {
    const items = await navigator.clipboard.read();
    for (const it of items) {
      if (it.types.includes('text/html')) html = await (await it.getType('text/html')).text();
      if (it.types.includes('text/plain')) text = await (await it.getType('text/plain')).text();
    }
  } else if (navigator.clipboard && navigator.clipboard.readText) text = await navigator.clipboard.readText();
  const out = html ? htmlToText(html) : text;
  if (!out.trim()) throw new Error('empty');
  return out;
}
async function pasteAndPrint() {
  try {
    const t = await readClipboard();
    $('#src').value = t; state.docId = null; renderAll();
    setTimeout(() => window.print(), 150);
  } catch (e) { flash(cur.pasteFail, 5000); $('#src').focus(); }
}

const SWATCHES = ['#000000', '#1f3a93', '#1f5fbf', '#007b7b', '#1e7b3c', '#d0312d', '#e67e22', '#6b3fa0'];
function buildSwatches() {
  const box = $('#swatches'); box.innerHTML = '';
  SWATCHES.forEach(c => { const b = document.createElement('button'); b.className = 'sw' + (c === state.accent ? ' on' : ''); b.style.background = c; b.title = c; b.onclick = () => setAccent(c); box.appendChild(b); });

}
function setAccent(c) { state.accent = c; buildSwatches(); savePrefs(); renderAll(); }
const ZOOMS = [50, 75, 100, 125, 150, 200];
function zoomStep(dir) {
  const pctNow = parseInt($('#zoomPct').textContent, 10) || 100;
  const next = dir > 0 ? ZOOMS.find(z => z > pctNow + 2) : ZOOMS.slice().reverse().find(z => z < pctNow - 2);
  if (next) { state.zoom = next; savePrefs(); scheduleFit(); }

function detectLang() {
  const list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
  const codes = Kpee.langOrder;
  for (const raw of list) {
    const l = String(raw).toLowerCase();
    const exact = codes.find(c => c.toLowerCase() === l); if (exact) return exact;
    if (l.startsWith('zh')) { const tw = /hant|tw|hk|mo/.test(l); const pick = codes.find(c => c.toLowerCase() === (tw ? 'zh-tw' : 'zh-cn')); if (pick) return pick; }
    const base = l.split('-')[0];
    const alias = { no: 'nb', nn: 'nb', iw: 'he', in: 'id' }[base] || base;

function applyLang() {

function savePrefs() { store.set('kpee:prefs', { lang, mode: state.mode, style: state.style, font: state.font, size: state.size, spacing: state.spacing, margin: state.margin, paper: state.paper, accent: state.accent, zoom: state.zoom, notes: state.notes, pagenum: state.pagenum, showDate: state.showDate }); }

function init() {
  const p = store.get('kpee:prefs', null);
  if (!p) state.paper = /^(en-(us|ca|ph)|es-(mx|us)|fr-ca)$/i.test(navigator.language || '') ? 'letter' : 'a4';
  if (p) { ['mode', 'style', 'font', 'size', 'spacing', 'margin', 'paper', 'accent', 'zoom', 'notes', 'pagenum', 'showDate'].forEach(k => { if (p[k] != null) state[k] = p[k]; }); }
  lang = (p && Kpee.languages[p.lang]) ? p.lang : detectLang();

  $('#font').value = state.font; $('#size').value = state.size; $('#spacing').value = state.spacing; $('#margin').value = state.margin; $('#paperSize').value = state.paper;
  $('#notes').checked = state.notes; $('#pagenum').checked = state.pagenum; $('#showDate').checked = state.showDate;
  applyLang(); buildSwatches();

  const src = $('#src');

  else src.value = cur.sample || SAMPLE;

  let tm; src.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(renderAll, 120); });
  src.addEventListener('paste', e => {
    const html = e.clipboardData && e.clipboardData.getData('text/html');

  });
  $('#fmtbar').addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });   // keep the text selection
  $('#fmtbar').onclick = e => {

  $('#style').onchange = e => { state.style = e.target.value; savePrefs(); renderAll(); };
  $('#font').onchange = e => { state.font = e.target.value; savePrefs(); renderAll(); };
  $('#size').oninput = e => { const v = parseFloat(e.target.value); if (v >= 6 && v <= 30) { state.size = v; savePrefs(); renderAll(); } };

  $('#accent').oninput = e => setAccent(e.target.value);
  $('#notes').onchange = e => { state.notes = e.target.checked; savePrefs(); renderAll(); };

  $('#title').oninput = e => { state.title = e.target.value; renderAll(); };
  $('#lang').onchange = e => { lang = e.target.value; savePrefs(); applyLang(); renderAll(); };

  $('#bNew').onclick = () => { src.value = ''; state.docId = null; state.title = ''; $('#title').value = ''; renderAll(); src.focus(); };
  $('#bDocs').onclick = openDocs;
  $('#bSave').onclick = saveDoc;
  $('#bPrint').onclick = () => { renderAll(); window.print(); };
  $('#bClear').onclick = clearAll; $('#bClear2').onclick = clearAll;
  $('#bPastePrint').onclick = pasteAndPrint;
  $('#bPractice').onclick = openPractice;
  $('#bAbout').onclick = () => showDlg('#dlgAbout');
  $$('[data-zoom]').forEach(b => b.onclick = () => { if (b.dataset.zoom === 'fit') { state.zoom = 'fit'; savePrefs(); scheduleFit(); } else zoomStep(b.dataset.zoom === '+' ? 1 : -1); });
  $('.tico').innerHTML = Kpee.icons.printer;
  // drop a .txt / .md / .csv / .html file anywhere on the window

  app.addEventListener('dragleave', e => { if (!app.contains(e.relatedTarget)) app.classList.remove('drop'); });
  app.addEventListener('drop', e => {
    app.classList.remove('drop');

    e.preventDefault();
    if (/\.(docx?|pptx?|xlsx?|pdf)$/i.test(f.name)) { flash(cur.dropOffice, 5000); return; }
    if (f.size > 5e6) return;
    const r = new FileReader();
    r.onload = () => {

  $('#pPrev').onclick = () => pMove(-1); $('#pNext').onclick = () => pMove(1); $('#pShuffle').onclick = pShuffle;
  $$('[data-close]').forEach(b => b.onclick = closeDialogs);
  $('#overlay').onclick = closeDialogs;
  $('#docList').onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.open) loadDoc(b.dataset.open); else if (b.dataset.del) deleteDoc(b.dataset.del); };

  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
    if (e.key === 'Escape') { closeDialogs(); return; }
    if (e.key === 'F1') { e.preventDefault(); showDlg('#dlgAbout'); return; }
    if (isOpen('#dlgPractice')) {
      const onBtn = e.target && e.target.tagName === 'BUTTON';
      if ((e.key === ' ' || e.key === 'Enter') && onBtn) return;
      if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); pFlip(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); pMove(cur._rtl ? -1 : 1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); pMove(cur._rtl ? 1 : -1); }
      return;
    }
    const dm = /^(?:Digit|Numpad)([1-9])$/.exec(e.code || '');
    if (e.altKey && !mod && dm) { const id = Kpee.order[+dm[1] - 1]; if (id) { e.preventDefault(); setMode(id); } return; }
    if (!mod) return;
    if (k === 's') { e.preventDefault(); saveDoc(); }
    else if (k === 'o') { e.preventDefault(); openDocs(); }
    else if (k === 'd') { e.preventDefault(); clearAll(); }
    else if (k === 'p') { renderAll(); }
  });
  window.addEventListener('beforeprint', renderAll);
  window.addEventListener('resize', scheduleFit);
  if (window.ResizeObserver) new ResizeObserver(scheduleFit).observe($('#desk'));

  state.ready = true;
  renderAll();
  src.focus();
}

<script id="kpee-user">
// ============================================================================
//  USER ZONE  /  ユーザーゾーン
//
//  Kpee is one file. Open it in any text editor and write your own code here.
//  Save, then reload the file in the browser. Delete any example you don't want.
//  To switch an example on, remove the  //  at the start of its lines (or the /* and */ around it).
//
//  Kpee は1つのファイル。テキストエディタで開いて、ここに自分のコードを書く。
//  保存してブラウザで開き直せば反映。例を有効にするには、行頭の // （または /* と */）を消す。
//
//  API
//    Kpee.setLabels({ key: 'text' })            change any text in the app, every language
//    Kpee.setLabels('ja', { key: 'text' })      change text for one language only
//    Kpee.setWelcome(t => '<html>')             replace the whole empty page (t = current labels)
//    Kpee.addStyle(id, { name, css })           a new look; the page has class .paper.style-<id>
//    Kpee.addMode(id, { icon, name, desc, render(doc, ctx) })
//        doc: { blocks, text, bodyText, title, date }    ctx: { t, lang, options, util }
//        return { html, info }
//    Kpee.addBlock(id, { match(line, lines, i), collect(lines, i) -> endIndex, render(lines, ctx) })
//    Kpee.addLanguage(code, { _name, _rtl?, ...labels })   missing labels fall back to English
//    Kpee.util = { esc, inline, parse, renderBlocks, groupByHeading, splitDef, autoKey, stripMarks,
//                  extractCards, matchPlugin, tableRows, htmlToText, COLORS }
//    name / desc can be 'Text', { en: 'Text', ja: 'テキスト' }, or t => t.someLabel
// ============================================================================


// Example 1 — the text on the empty page ("Paste your notes on the left.").
// 例1 — 空のページの文言を変える。
//
// Kpee.setLabels({ empty: 'Drop your notes here.' });                  // every language
// Kpee.setLabels('ja', { empty: 'ここにノートを貼ってね' });           // Japanese only
// Kpee.setLabels('ja', { step2: 'モードは「穴埋め」がおすすめ。' });      // any other label works too
//
// Or replace the whole empty page with your own HTML:
// Kpee.setWelcome(t => '<div style="text-align:center;padding-top:40mm">'
//   + '<h1>' + t.empty + '</h1>'
//   + '<p>Brillantmont · IGCSE revision</p></div>');


// Example 2 — Excel-style table.
// Cells copied from Excel / Google Sheets arrive tab-separated and become a real table.
// You can also type   A | B | C   by hand.  The first row is the header.
// A two-column table (Term | Meaning) also becomes flashcards.
Kpee.addBlock('table', {
  match: line => /\S\t/.test(line) || /^\s*\|.*\|\s*$/.test(line),          // a tab between cells (not indentation)
  collect: (lines, i) => { let j = i; while (j < lines.length && (/\S\t/.test(lines[j]) || /^\s*\|.*\|\s*$/.test(lines[j]))) j++; return j; },
  render: (lines, ctx) => {
    const [head, ...body] = Kpee.util.tableRows(lines);
    const cell = (tag, c) => '<' + tag + '>' + ctx.fmt(c) + '</' + tag + '>';
    return '<table><thead><tr>' + head.map(c => cell('th', c)).join('') + '</tr></thead><tbody>'
      + body.map(r => '<tr>' + r.map(c => cell('td', c)).join('') + '</tr>').join('') + '</tbody></table>';
  }
});


// Example 3 — Cornell notes mode: cue column on the left, notes on the right, summary box at the bottom.
Kpee.addMode('cornell', {
  icon: Kpee.icons.cornell,          // or any text / emoji / <svg>
  name: t => t.modeCornell,
  desc: t => t.descCornell,
  render(doc, ctx) {
    const groups = ctx.util.groupByHeading(doc.blocks);
    const rows = groups.map(g =>
      '<tr><td class="q">' + ctx.util.inline(g.heading) + '</td><td>' + ctx.util.renderBlocks(g.blocks) + '</td></tr>'
    ).join('');
    return {
      html: '<table class="fold">' + rows + '</table><div class="summary"><b>' + ctx.t.summary + '</b></div>',
      info: groups.length + ' ' + ctx.t.sections
    };
  }
});


// Example 4 — your own colour names for {name|text}.
// 例4 — {名前|文字} で使える色を増やす。
// Kpee.util.COLORS.gold = '#b8860b';
// Kpee.util.COLORS['金'] = '#b8860b';


// Example 5 — window colours, like Win95 "Display Properties".
// document.documentElement.style.setProperty('--desk', '#3a6ea5');   // desktop
// document.documentElement.style.setProperty('--t1', '#800000');     // title bar, left
// document.documentElement.style.setProperty('--t2', '#d0312d');     // title bar, right


// Example 6 — your own style.

Kpee.addStyle('handout', {

     + '.paper.style-handout h2{background:var(--accent);color:#fff;padding:2px 8px;border:0}'
     + '.paper.style-handout .doc-head{border-bottom:4px double var(--accent)}'
});
*/


// Example 7 — add a language. A partial list is fine: missing labels show in English.

Kpee.addLanguage('eo', { _name: 'Esperanto', new: 'Nova', save: 'Konservi', print: 'Presi', clearAll: 'Forigi ĉion',
